name: Build private Astra dashboard
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build_dashboard.py'
      - '.github/workflows/build-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra-dashboard-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate snapshot
        run: python scripts/build_dashboard.py
      - name: Commit only when dashboard changed
        run: |
          if git diff --quiet -- dashboard.html && [[ -f dashboard.html ]]; then
            echo "Dashboard up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh private Astra dashboard snapshot'
            git push
          fi
