name: Astra 08AM Discovery + Audit
on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-daily.yml'
      - 'scripts/discover_ats.py'
      - 'scripts/build_jd_verification_queue.py'
      - 'scripts/jd_extract.py'
      - 'scripts/jd_evidence.py'
      - 'scripts/preliminary_scoring.py'
      - 'scripts/score_preliminary_fit.py'
      - 'scripts/workflow_status.py'
      - 'tests/test_ats*.py'
permissions:
  contents: write
env:
  PYTHONPATH: .
concurrency:
  group: astra-daily
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: tests
        name: Test job discovery and scoring
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_ats*.py'
      - id: discovery
        name: Collect live vacancies and save JD evidence
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: python scripts/discover_ats.py
      - id: scoring
        name: Build evidence verification queue
        if: steps.discovery.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_jd_verification_queue.py
      - name: Record execution, data timestamps and failures
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
          SCORING_RESULT: ${{ steps.scoring.outcome }}
        run: python scripts/workflow_status.py
      - name: Commit candidate data and audit, including failures
        if: always()
        run: |
          git config user.name "astra-discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_candidates.json data/jd_verification_queue.json data/run_reports/ats_discovery_latest.json data/run_reports/workflow_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Astra: publish latest discovery and execution audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail workflow if jobs failed or were skipped
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
          DISCOVERY_RESULT: ${{ steps.discovery.outcome }}
          SCORING_RESULT: ${{ steps.scoring.outcome }}
        run: |
          test "$TEST_RESULT" = success
          test "$DISCOVERY_RESULT" = success
          test "$SCORING_RESULT" = success
