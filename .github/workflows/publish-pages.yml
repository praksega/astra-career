name: Publish public Astra dashboard
on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/linkedin_posts.json'
      - 'scripts/build_public_site.py'
      - 'scripts/linkedin_rules.py'
      - '.github/workflows/publish-pages.yml'
  schedule:
    - cron: '17 * * * *' # Hourly rebuild to expire 24h LinkedIn posts (may be delayed)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build public-safe site
        run: |
          python -m py_compile scripts/build_public_site.py scripts/linkedin_rules.py
          python scripts/build_public_site.py
      - name: Verify dashboard sections and public-only content
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          page = Path("public_site/index.html").read_text(encoding="utf-8")
          assert "Strong Matches (86" in page
          assert "Possible Matches (71" in page
          assert "Relevant LinkedIn Hiring Posts" in page
          assert "<html" in page and "</html>" in page
          assert "Cover_Letter.docx" not in page
          assert "master_resume_index" not in page
          assert "applications.json" not in page
          data = json.loads(Path("data/linkedin_posts.json").read_text())
          assert isinstance(data["posts"], list)
          print("Astra public dashboard smoke checks passed")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
