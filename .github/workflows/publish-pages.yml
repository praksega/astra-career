name: Publish public Astra dashboard
on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - 'data/linkedin_posts.json'
      - 'scripts/build_public_site.py'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build public-safe site
        run: python scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site
      - id: deployment
        uses: actions/deploy-pages@v4
